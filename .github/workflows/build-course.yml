# ============================================================================
# GitHub Action: Regenerar curso HTML cuando se edite un JSON en borradores/
#
# Se dispara al hacer push a main con cambios en:
#   05-Generador-Cursos/borradores/*.json
#
# El workflow:
#   1. Detecta cual(es) JSON cambiaron
#   2. Ejecuta build-course.js por cada uno
#   3. Hace commit y push de los archivos generados
#
# ⚠️ Ya NO copia el HTML a una carpeta de la raiz: ese paso fabricaba una segunda copia
#    de cada curso, que divergia de la del generador (ADR-063, 18-sep-2026).
# ============================================================================

name: Build Course HTML

on:
  push:
    branches: [main]
    paths:
      - '05-Generador-Cursos/borradores/*.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect changed course JSONs
        id: detect
        run: |
          # Listar los .json que cambiaron en este push
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- '05-Generador-Cursos/borradores/*.json' 2>/dev/null || echo "")
          if [ -z "$CHANGED" ]; then
            echo "No course JSONs changed in this commit."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Changed files:"
            echo "$CHANGED"
            # Extraer solo los nombres de curso (sin extension ni ruta)
            COURSES=$(echo "$CHANGED" | sed 's|.*/||; s|\.json$||' | tr '\n' ' ')
            echo "courses=$COURSES" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build course(s)
        if: steps.detect.outputs.skip != 'true'
        run: |
          cd 05-Generador-Cursos
          for COURSE in ${{ steps.detect.outputs.courses }}; do
            echo "========================================="
            echo "Building: $COURSE"
            echo "========================================="
            node build-course.js "$COURSE"
          done

      # ⚠️ Aqui habia un paso "Copy generated HTML to root for GitHub Pages" que hacia
      # `mkdir -p "$COURSE"` y copiaba el HTML a `<courseId>/index.html`. Se retiro el
      # 18-sep-2026 (ADR-063): era la maquina que fabricaba una SEGUNDA copia de cada
      # curso en la raiz. Convivieron año y medio y divergieron, y el enlace de la
      # landing apuntaba a la carpeta equivocada -404 en un curso `active`-.
      #
      # Hoy la landing sirve desde 02-Plataforma-Web/, que es la salida del generador y
      # la unica copia, igual que en las otras cuatro lineas. Dejar este paso habria
      # recreado el problema en cuanto alguien tocara un JSON.
      #
      # Las carpetas `fundamentos/` y `caracteristicas-educativas/` siguen ahi, pero con
      # una REDIRECCION dentro, por si alguien guardo ese enlace. No las regenera nadie.

      - name: Commit and push generated files
        if: steps.detect.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Sin `*/index.html`: ya no se generan copias en la raiz (ADR-063), y ese
          # comodin barria tambien las redirecciones que viven en esas carpetas.
          git add 02-Plataforma-Web/*.html 02-Plataforma-Web/cursos.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "build: regenerar curso(s) HTML desde borradores [skip ci]

            Cursos: ${{ steps.detect.outputs.courses }}
            Generado automaticamente por GitHub Actions"
            git push
          fi
